<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لـ ملكي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Great+Vibes&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg1: #25081c;
        --bg2: #4b1233;
        --card: rgba(255, 255, 255, 0.12);
        --card-border: rgba(255, 255, 255, 0.2);
        --pink: #ff6fb5;
        --pink-2: #ff9ed0;
        --rose: #ff4d8d;
        --gold: #ffd166;
        --text: #fff7fb;
        --muted: #f7d5e6;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Cairo", sans-serif;
        background: linear-gradient(135deg, var(--bg1), var(--bg2), #1d0b1d);
        color: var(--text);
        overflow-x: hidden;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        position: relative;
      }

      .bg-orb {
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 100, 170, 0.45), rgba(255, 100, 170, 0));
        filter: blur(20px);
        animation: floatOrb 8s ease-in-out infinite alternate;
      }

      .orb-1 { top: 8%; left: 8%; }
      .orb-2 { right: 10%; bottom: 10%; animation-delay: 1.5s; }

      .container {
        width: min(92vw, 760px);
        padding: 28px;
        position: relative;
        z-index: 1;
      }

      .card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--card-border);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        border-radius: 28px;
        padding: 28px 28px 22px;
        backdrop-filter: blur(18px);
        overflow: hidden;
      }

      .card::before,
      .card::after {
        content: "";
        position: absolute;
        inset: auto auto -60px -40px;
        width: 180px;
        height: 180px;
        background: rgba(255, 111, 181, 0.18);
        filter: blur(20px);
        border-radius: 50%;
      }

      .card::after {
        inset: -40px -50px auto auto;
        background: rgba(255, 209, 102, 0.16);
      }

      .top-label {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--muted);
        font-size: 0.82rem;
        letter-spacing: 1px;
        margin-bottom: 16px;
      }

      .heart-badge {
        color: var(--pink-2);
        font-size: 1.1rem;
        animation: pulseHeart 1.5s infinite ease-in-out;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.3rem, 5vw, 4.3rem);
        line-height: 1.1;
        font-weight: 900;
        letter-spacing: -1px;
      }

      .signature {
        font-family: "Great Vibes", cursive;
        display: block;
        color: var(--gold);
        font-size: clamp(2.4rem, 5vw, 4rem);
        margin-top: 8px;
        margin-bottom: 10px;
      }

      .message {
        margin: 12px 0 20px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 2;
      }

      .meter {
        width: 100%;
        height: 14px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.12);
        margin: 20px 0 18px;
      }

      .meter-fill {
        width: 98%;
        height: 100%;
        display: block;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--rose), var(--pink), var(--gold));
        box-shadow: 0 0 24px rgba(255, 95, 160, 0.7);
        animation: fillMeter 3s ease-in-out infinite alternate;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }

      button {
        border: 0;
        font: inherit;
        cursor: pointer;
        transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--pink), var(--rose));
        color: white;
        padding: 14px 26px;
        border-radius: 999px;
        font-weight: 700;
        box-shadow: 0 20px 40px rgba(255, 77, 141, 0.35);
      }

      .secondary-btn {
        background: rgba(255,255,255,0.08);
        color: var(--text);
        padding: 14px 22px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.14);
      }

      button:hover {
        transform: translateY(-2px) scale(1.02);
      }

      .secret {
        margin-top: 18px;
        min-height: 60px;
        display: grid;
        place-items: center;
        padding: 16px 18px;
        border-radius: 18px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        color: #ffeaf5;
        font-weight: 600;
        letter-spacing: 0.3px;
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.3s ease;
      }

      .secret.show {
        opacity: 1;
        transform: translateY(0);
      }

      .floating-hearts {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .floating-hearts span {
        position: absolute;
        bottom: -60px;
        font-size: clamp(1rem, 2vw, 1.8rem);
        color: rgba(255, 147, 196, 0.9);
        animation: rise 7s linear infinite;
        opacity: 0.7;
      }

      .floating-hearts span:nth-child(1) { left: 10%; animation-delay: 0s; }
      .floating-hearts span:nth-child(2) { left: 22%; animation-delay: 1.7s; }
      .floating-hearts span:nth-child(3) { left: 40%; animation-delay: 3.2s; }
      .floating-hearts span:nth-child(4) { left: 58%; animation-delay: 2.4s; }
      .floating-hearts span:nth-child(5) { left: 75%; animation-delay: 0.8s; }
      .floating-hearts span:nth-child(6) { left: 85%; animation-delay: 4.1s; }

      @keyframes rise {
        0% {
          transform: translateY(0) scale(0.8) rotate(0deg);
          opacity: 0;
        }
        15% { opacity: 0.7; }
        100% {
          transform: translateY(-110vh) scale(1.2) rotate(15deg);
          opacity: 0;
        }
      }

      @keyframes pulseHeart {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
      }

      @keyframes fillMeter {
        0% { width: 80%; }
        100% { width: 100%; }
      }

      @keyframes floatOrb {
        0% { transform: translateY(0) scale(1); }
        100% { transform: translateY(-25px) scale(1.08); }
      }

      @media (max-width: 580px) {
        .card {
          padding: 22px 18px 18px;
          border-radius: 24px;
        }

        .actions {
          flex-direction: column;
        }

        .primary-btn, .secondary-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="container">
      <section class="card">
        <div class="floating-hearts" aria-hidden="true">
          <span>❤</span>
          <span>❤</span>
          <span>❤</span>
          <span>❤</span>
          <span>❤</span>
          <span>❤</span>
        </div>

        <div class="top-label">
          <span class="heart-badge">❤</span>
          <span>قصة حب لا تنتهي</span>
        </div>

        <h1>لـ ملكي</h1>
        <span class="signature">My Love</span>

        <p class="message">
          كل نبضة في قلبي تهمس باسمك، وكل يوم معك يصبح أجمل من اللي قبله.<br />
          أنتِ نور حياتي، سرّ سعادتي، وفرحتي العظيمة، والغاية من كل أحلامي.
        </p>

        <div class="meter" aria-label="مستوى الحب">
          <span class="meter-fill"></span>
        </div>

        <div class="actions">
          <button class="primary-btn" id="loveBtn">أحبك 💖</button>
          <button class="secondary-btn" id="noteBtn">رسالة خاصة</button>
        </div>

        <div class="secret" id="secretBox">
          أنتِ كل شيء جميل في هذا العالم، ومهما مرت الأيام فأنا سأحبك أكثر وأكثر.
        </div>
      </section>
    </main>

    <script>
      const loveBtn = document.getElementById('loveBtn');
      const noteBtn = document.getElementById('noteBtn');
      const secretBox = document.getElementById('secretBox');

      loveBtn.addEventListener('click', () => {
        loveBtn.textContent = 'أحبك أكثر 💞';
        secretBox.textContent = 'أنتِ أجمل حلم، وأحلى حقيقة، وأعز إنسانة في قلبي.';
        secretBox.classList.add('show');
      });

      noteBtn.addEventListener('click', () => {
        secretBox.textContent = 'كل صباح أفتح عينيّ وأشكر الله لأنكِ في حياتي، فبكِ أصبحت كل لحظة جميلة.';
        secretBox.classList.add('show');
      });
    </script>
  </body>
</html>
